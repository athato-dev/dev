<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>athato</title>
  <meta
    name="description"
    content="Yash Singh documents what he is learning, building, and investigating."
  >

  <script>
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme) {
      document.documentElement.dataset.theme = savedTheme;
    }
  </script>

  <style>
    :root {
      color-scheme: light;

      --background: #f3f0e8;
      --text: #20211f;
      --muted: #686b62;
      --border: #d8d4c9;
      --accent: #a44a2f;
      --accent-hover: #813722;

      --serif: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono",
        monospace;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;

      --background: #171916;
      --text: #eae7de;
      --muted: #a5a79e;
      --border: #343831;
      --accent: #e07855;
      --accent-hover: #f09372;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: var(--serif);
      text-rendering: optimizeLegibility;
    }

    button,
    a {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .page {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(100%, 72rem);
      min-height: 100svh;
      margin-inline: auto;
      padding:
        clamp(1.5rem, 4vw, 3rem)
        clamp(1.25rem, 5vw, 4rem);
    }

    .site-header,
    .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      font-family: var(--mono);
      font-size: 0.8125rem;
    }

    .brand {
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
    }

    .theme-button {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .theme-button[aria-pressed="true"] {
      border-bottom-color: var(--accent);
      color: var(--accent);
    }

    .theme-button:hover {
      color: var(--accent-hover);
    }

    main {
      display: flex;
      align-items: center;
      padding-block: clamp(4rem, 12vh, 8rem);
    }

    .intro {
      width: min(100%, 48rem);
    }

    .prompt,
    .status {
      margin: 0;
      font-family: var(--mono);
      font-size: clamp(0.8rem, 1.5vw, 0.95rem);
      line-height: 1.6;
    }

    .prompt {
      color: var(--text);
    }

    .prompt-symbol {
      color: var(--accent);
    }

    h1 {
      margin: 1rem 0 1.5rem;
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.055em;
    }

    .statement {
      max-width: 46rem;
      margin: 0;
      font-size: clamp(1.25rem, 2.6vw, 2rem);
      line-height: 1.4;
      text-wrap: balance;
    }

    .status {
      margin-top: 2rem;
      color: var(--muted);
    }

    .site-footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .site-footer p {
      margin: 0;
    }

    .email {
      color: var(--accent);
      text-decoration-color: var(--accent);
      text-underline-offset: 0.3em;
    }

    .email:hover {
      color: var(--accent-hover);
      text-decoration-color: var(--accent-hover);
    }

    @media (max-width: 40rem) {
      .page {
        grid-template-rows: auto auto auto;
      }

      main {
        align-items: flex-start;
        padding-block: clamp(5rem, 14vh, 8rem);
      }

      .statement {
        text-wrap: auto;
      }

      .site-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 1rem;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;

        --background: #171916;
        --text: #eae7de;
        --muted: #a5a79e;
        --border: #343831;
        --accent: #e07855;
        --accent-hover: #f09372;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      body,
      button,
      a {
        transition:
          background-color 160ms ease,
          color 160ms ease,
          border-color 160ms ease;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="site-header">
      <p class="brand">athato</p>

      <div class="theme-switcher" aria-label="Colour theme">
        <button
          class="theme-button"
          id="light-theme"
          type="button"
          aria-label="Use light theme"
          aria-pressed="false"
        >
          light
        </button>

        <span aria-hidden="true">/</span>

        <button
          class="theme-button"
          id="dark-theme"
          type="button"
          aria-label="Use dark theme"
          aria-pressed="false"
        >
          dark
        </button>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="prompt">
          <span class="prompt-symbol" aria-hidden="true">&gt;</span>
          beginning here
        </p>

        <h1 id="page-title">Hello.</h1>

        <p class="statement">
          I’m Yash. This is where I’ll document what I am learning,
          building, and investigating.
        </p>

        <p class="status">athato.dev · work in progress</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 Yash Singh</p>

      <a class="email" href="mailto:dev@athato.dev">
        dev@athato.dev
      </a>
    </footer>
  </div>

  <script>
    const root = document.documentElement;
    const lightButton = document.querySelector("#light-theme");
    const darkButton = document.querySelector("#dark-theme");

    function preferredTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    function currentTheme() {
      return root.dataset.theme || preferredTheme();
    }

    function updateThemeControls() {
      const theme = currentTheme();

      lightButton.setAttribute("aria-pressed", theme === "light");
      darkButton.setAttribute("aria-pressed", theme === "dark");
    }

    function setTheme(theme) {
      root.dataset.theme = theme;
      localStorage.setItem("theme", theme);
      updateThemeControls();
    }

    lightButton.addEventListener("click", () => setTheme("light"));
    darkButton.addEventListener("click", () => setTheme("dark"));

    window
      .matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", updateThemeControls);

    updateThemeControls();
  </script>
</body>
</html>
